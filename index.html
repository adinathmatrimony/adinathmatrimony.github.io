<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adinath Matrimony — Share a Biodata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500;600&family=Inter:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&family=Noto+Sans+Gujarati:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --maroon:#A5152F; --maroon-soft:#C0304A; --gold:#C0912E; --gold-soft:#E5C27A;
  --bg:#FFFAF3; --surface:#FFFFFF; --surface-2:#FBF0E4;
  --text:#2A1A20; --muted:#6E5A60; --line:#E6D8CE;
  --radius:14px;
  --paper:#FFFCF6; --ink:#3A1018; --gold-ink:#9A6B1E; --band:#8E0E2A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16100F; --surface:#221917; --surface-2:#2C211F;
    --text:#F3E9E2; --muted:#B49C95; --line:#3A2C29;
    --maroon:#D9819C; --maroon-soft:#C96A88; --gold:#E3C179;
  }
}
:root[data-theme="dark"]{
  --bg:#16100F; --surface:#221917; --surface-2:#2C211F;
  --text:#F3E9E2; --muted:#B49C95; --line:#3A2C29;
  --maroon:#D9819C; --maroon-soft:#C96A88; --gold:#E3C179;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:Inter,"Noto Sans Devanagari","Noto Sans Gujarati",system-ui,sans-serif;
  font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
body[data-lang="hi"]{font-family:"Noto Sans Devanagari",Inter,sans-serif}
body[data-lang="gu"]{font-family:"Noto Sans Gujarati",Inter,sans-serif}
img{max-width:100%}
h1,h2,h3{font-family:"Cormorant Garamond","Noto Sans Devanagari","Noto Sans Gujarati",serif;font-weight:600;line-height:1.25;margin:0}
.wrap{width:100%;max-width:640px;margin:0 auto;padding:0 20px}

/* ---------- language gate ---------- */
#gate{position:absolute;inset:0;min-height:100%;z-index:50;overflow-y:auto;
  background:linear-gradient(180deg,#FFF8EE 0%,#F7E3D4 100%);
  display:flex;align-items:flex-start;justify-content:center;
  padding:0 0 40px}
#gate .card{width:100%;max-width:520px;background:var(--paper);
  box-shadow:0 18px 60px rgba(90,20,35,.18)}
.poster{display:block;width:100%;height:auto}
.gate-pick{padding:26px 22px 30px;text-align:center}
.gate-pick h1{font-size:24px;color:var(--maroon);font-weight:500}
.gate-pick p{color:var(--muted);font-size:14px;margin:6px 0 20px}
.langbtn{display:flex;align-items:center;justify-content:space-between;width:100%;
  margin-top:9px;padding:15px 18px;border:1px solid var(--line);background:transparent;
  border-radius:4px;color:var(--ink);font-size:17px;cursor:pointer;
  font-family:inherit;transition:border-color .15s,background .15s}
.langbtn:hover,.langbtn:focus-visible{border-color:var(--gold);background:#FFF9F0}
.langbtn small{color:var(--muted);font-size:12px}

/* ---------- hero ---------- */
#app{display:none}
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  padding:46px 20px 108px;overflow:hidden;
  background:
    radial-gradient(60% 40% at 88% 8%, rgba(214,73,104,.16) 0%, transparent 60%),
    radial-gradient(55% 40% at 8% 22%, rgba(214,73,104,.13) 0%, transparent 60%),
    radial-gradient(70% 45% at 50% 30%, #FFFFFF 0%, #FFFDF9 45%, #FDF0E2 100%)}
.arch{position:absolute;top:3%;left:50%;transform:translateX(-50%);
  width:min(86vw,400px);opacity:.5;pointer-events:none}
.petal{position:absolute;top:-8%;width:10px;height:14px;border-radius:60% 0 60% 0;
  background:var(--maroon);opacity:.25;animation:fall linear infinite}
.petal.g{background:var(--gold)}
@keyframes fall{0%{transform:translate3d(0,-12vh,0) rotate(0)}
  100%{transform:translate3d(34px,116vh,0) rotate(400deg)}}
.hero .inner{position:relative;max-width:520px;width:100%;
  animation:rise .9s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.logo-slot{width:min(76vw,320px);margin:0 auto 4px}
.logo-slot img{width:100%;height:auto;display:block}
.hero h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hero .eyebrow{font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:17px;color:var(--maroon);margin-top:2px}
.hero .divider{width:88px;height:9px;margin:16px auto 14px;opacity:.9}
.hero p{color:var(--muted);margin:0 auto 26px;max-width:36ch;font-size:15px}
.trust{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 22px;
  margin-top:30px;max-width:460px}
.trust div{display:flex;flex-direction:column;align-items:center;gap:6px;
  width:78px;font-size:11px;line-height:1.35;color:var(--muted)}
.trust span{width:38px;height:38px;border-radius:50%;background:#FFF6E9;
  border:1px solid var(--gold-soft);display:flex;align-items:center;
  justify-content:center;color:var(--maroon);font-size:17px}
.band{position:absolute;left:0;right:0;bottom:0;
  background:linear-gradient(180deg,var(--band) 0%,#6E0B20 100%);
  color:#F6DDA8;font-size:11.5px;letter-spacing:.08em;text-align:center;
  padding:13px 18px calc(13px + env(safe-area-inset-bottom,0px));
  border-top:1px solid rgba(246,221,168,.35)}
.scrolldown{position:absolute;bottom:calc(64px + env(safe-area-inset-bottom,0px));
  left:50%;transform:translateX(-50%);color:var(--maroon);font-size:12px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  text-decoration:none;opacity:.75}
.chev{width:12px;height:12px;border-right:1.5px solid var(--maroon);
  border-bottom:1.5px solid var(--maroon);transform:rotate(45deg);
  animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:rotate(45deg) translate(0,0)}
  50%{transform:rotate(45deg) translate(3px,3px)}}
@media (prefers-reduced-motion:reduce){
  .chev,.petal{animation:none}.petal{display:none}.hero .inner{animation:none}}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:15px 26px;border-radius:999px;border:none;cursor:pointer;
  font-family:inherit;font-size:16px;font-weight:500;transition:opacity .15s,transform .1s}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--maroon);color:#fff}
:root[data-theme="dark"] .btn-primary,
@media (prefers-color-scheme:dark){}
.btn-ghost{background:transparent;color:var(--maroon);border:1px solid var(--line)}
.btn-wa{background:#1FA855;color:#fff;width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:10px;margin-top:26px}
.btn-row .btn{flex:1}

/* ---------- form ---------- */
section.pane{padding:56px 0 72px}
.steps{display:flex;gap:6px;margin-bottom:26px}
.steps i{flex:1;height:3px;border-radius:2px;background:var(--line);display:block}
.steps i.on{background:var(--maroon)}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
h2{font-size:clamp(23px,5.5vw,30px)}
.sub{color:var(--muted);margin:8px 0 26px}
label{display:block;font-size:14px;font-weight:500;margin:18px 0 7px}
label span{color:var(--maroon)}
input,select,textarea{width:100%;padding:14px 15px;border:1px solid var(--line);
  border-radius:var(--radius);background:var(--surface);color:var(--text);
  font-family:inherit;font-size:16px}
input:focus,select,textarea:focus{outline:2px solid var(--maroon-soft);outline-offset:1px}
textarea{min-height:120px;resize:vertical}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.err{font-size:13px;color:#C0392B;margin-top:6px;display:none}
.err.show{display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{padding:8px 14px;border:1px dashed var(--line);border-radius:999px;
  background:transparent;color:var(--muted);font-size:13px;cursor:pointer;font-family:inherit}
.chip:hover{border-color:var(--maroon);color:var(--maroon)}
.drop{border:1.5px dashed var(--line);border-radius:var(--radius);padding:28px 18px;
  text-align:center;cursor:pointer;background:var(--surface)}
.drop:hover{border-color:var(--maroon)}
.drop .big{font-size:28px;color:var(--maroon)}
.drop b{display:block;margin-top:8px;font-weight:500}
.filebar{display:none;align-items:center;gap:12px;margin-top:12px;padding:12px 14px;
  border:1px solid var(--line);border-radius:var(--radius);background:var(--surface-2)}
.filebar.show{display:flex}
.filebar .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.filebar button{background:none;border:none;color:var(--maroon);cursor:pointer;font-family:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media (max-width:480px){.two{grid-template-columns:1fr}}

/* ---------- review ---------- */
.rev{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);
  overflow:hidden;margin-bottom:18px}
.rev .row{display:flex;gap:14px;padding:13px 16px;border-bottom:1px solid var(--line);font-size:15px}
.rev .row:last-child{border-bottom:none}
.rev .row .k{color:var(--muted);flex:0 0 40%;font-size:14px}
.rev .row .v{flex:1;word-break:break-word}
.viewer{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  background:var(--surface-2);margin-bottom:18px}
.viewer iframe,.viewer img{display:block;width:100%;height:420px;border:none;object-fit:contain;background:var(--surface-2)}

/* ---------- plans ---------- */
.plan{display:block;border:1.5px solid var(--line);border-radius:var(--radius);
  background:var(--surface);padding:18px;margin-bottom:12px;cursor:pointer;position:relative}
.plan.sel{border-color:var(--maroon);background:var(--surface-2)}
.plan .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.plan .nm{font-weight:500;font-size:17px}
.plan .pr{font-family:"Cormorant Garamond",serif;font-size:24px;color:var(--maroon);white-space:nowrap}
.plan .ds{color:var(--muted);font-size:14px;margin-top:5px}
.tag{position:absolute;top:-10px;right:14px;background:var(--gold);color:#3B2703;
  font-size:11px;padding:3px 10px;border-radius:999px;letter-spacing:.06em}
.plan input{position:absolute;opacity:0;pointer-events:none}
.paybox{border:1px solid var(--line);border-radius:var(--radius);padding:16px;
  background:var(--surface-2);margin-top:6px;display:none}
.paybox.show{display:block}
.upi{font-family:ui-monospace,monospace;font-size:15px;background:var(--surface);
  border:1px solid var(--line);padding:10px 12px;border-radius:10px;margin-top:8px;
  display:flex;justify-content:space-between;align-items:center;gap:10px}
.consent{display:flex;gap:11px;align-items:flex-start;margin:22px 0 0;font-size:14px;color:var(--muted)}
.consent input{width:19px;height:19px;flex:0 0 auto;margin-top:2px;accent-color:var(--maroon)}

/* ---------- done ---------- */
.done{text-align:center;padding:80px 0 90px}
.done .tick{width:66px;height:66px;border-radius:50%;background:var(--maroon);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 22px}
footer{text-align:center;padding:30px 20px calc(36px + env(safe-area-inset-bottom,0px));
  color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
.langswitch{position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);display:flex;justify-content:flex-end;
  padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
.langswitch select{width:auto;padding:6px 10px;font-size:13px;border-radius:999px}
.hidden{display:none !important}
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <img id="poster" class="poster" src="poster.jpg" alt="Adinath Matrimony">
    <div class="gate-pick">
      <h1>Choose your language</h1>
      <p>अपनी भाषा चुनें &nbsp;·&nbsp; તમારી ભાષા પસંદ કરો</p>
      <button class="langbtn" data-set="en"><span>English</span><small>English</small></button>
      <button class="langbtn" data-set="hi"><span>हिन्दी</span><small>Hindi</small></button>
      <button class="langbtn" data-set="gu"><span>ગુજરાતી</span><small>Gujarati</small></button>
    </div>
  </div>
</div>

<div id="app">
  <div class="langswitch">
    <select id="langSel" aria-label="Language">
      <option value="en">English</option><option value="hi">हिन्दी</option><option value="gu">ગુજરાતી</option>
    </select>
  </div>

  <header class="hero">
    <svg class="arch" viewBox="0 0 200 240" aria-hidden="true" fill="none"
         stroke="#C0912E" stroke-width="1.4" stroke-linejoin="round">
      <path d="M100 10c-6 14-16 20-16 34 0 10 7 15 7 24 0 8-6 12-14 16
               -22 11-37 34-37 62v84h120v-84c0-28-15-51-37-62-8-4-14-8-14-16
               0-9 7-14 7-24 0-14-10-20-16-34Z" opacity=".65"/>
      <path d="M100 42c-4 9-11 13-11 22 0 7 5 10 5 16" opacity=".4"/>
    </svg>
    <div id="petals" aria-hidden="true"></div>

    <div class="inner">
      <div class="logo-slot"><img id="logo" src="logo.png" alt="Adinath Matrimony"></div>
      <h1 data-t="brand"></h1>
      <div class="eyebrow" data-t="eyebrow"></div>
      <svg class="divider" viewBox="0 0 88 9" aria-hidden="true">
        <path d="M0 4.5h32M56 4.5h32" stroke="#C0912E" stroke-width="1"/>
        <path d="M44 0.5 48.5 4.5 44 8.5 39.5 4.5Z" fill="#A5152F"/>
      </svg>
      <p data-t="heroSub"></p>
      <a class="btn btn-primary" href="#start" data-t="heroCta"></a>

      <div class="trust" id="trust"></div>
    </div>

    <a class="scrolldown" href="#start"><span data-t="scroll"></span><i class="chev"></i></a>
    <div class="band" data-t="motto"></div>
  </header>

  <main id="start">
    <!-- STEP 1 -->
    <section class="pane" id="p1">
      <div class="wrap">
        <div class="steps"><i class="on"></i><i></i><i></i><i></i></div>
        <div class="kicker" data-t="k1"></div>
        <h2 data-t="t1"></h2>
        <p class="sub" data-t="s1"></p>

        <label data-t="fYourName"></label>
        <input id="yourName" autocomplete="name">
        <div class="err" id="e_yourName" data-t="reqErr"></div>

        <label data-t="fWa"></label>
        <input id="wa" type="tel" inputmode="numeric" placeholder="98XXXXXXXX">
        <div class="hint" data-t="hWa"></div>
        <div class="err" id="e_wa" data-t="waErr"></div>

        <label data-t="fRelation"></label>
        <select id="relation"></select>
        <div class="err" id="e_relation" data-t="reqErr"></div>

        <div class="btn-row">
          <button class="btn btn-primary" data-go="p2" data-t="next"></button>
        </div>
      </div>
    </section>

    <!-- STEP 2 -->
    <section class="pane hidden" id="p2">
      <div class="wrap">
        <div class="steps"><i class="on"></i><i class="on"></i><i></i><i></i></div>
        <div class="kicker" data-t="k2"></div>
        <h2 data-t="t2"></h2>
        <p class="sub" data-t="s2"></p>

        <label data-t="fPerson"></label>
        <input id="person">
        <div class="err" id="e_person" data-t="reqErr"></div>

        <div class="two">
          <div>
            <label data-t="fGender"></label>
            <select id="gender"></select>
            <div class="err" id="e_gender" data-t="reqErr"></div>
          </div>
          <div>
            <label data-t="fBirth"></label>
            <input id="birth" type="number" inputmode="numeric" placeholder="1996" min="1940" max="2012">
          </div>
        </div>

        <label data-t="fCity"></label>
        <input id="city">

        <label data-t="fFile"></label>
        <div class="drop" id="drop">
          <div class="big">⬆</div>
          <b data-t="dropTitle"></b>
          <div class="hint" data-t="dropHint"></div>
        </div>
        <input type="file" id="file" accept="image/*,application/pdf,.pdf,.heic,.heif,.doc,.docx,.odt,.rtf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" class="hidden">
        <div class="filebar" id="filebar">
          <span class="nm" id="fileName"></span>
          <button type="button" id="fileClear" data-t="remove"></button>
        </div>
        <div class="err" id="e_file" data-t="fileErr"></div>

        <div class="btn-row">
          <button class="btn btn-ghost" data-go="p1" data-t="back"></button>
          <button class="btn btn-primary" data-go="p3" data-t="next"></button>
        </div>
      </div>
    </section>

    <!-- STEP 3 -->
    <section class="pane hidden" id="p3">
      <div class="wrap">
        <div class="steps"><i class="on"></i><i class="on"></i><i class="on"></i><i></i></div>
        <div class="kicker" data-t="k3"></div>
        <h2 data-t="t3"></h2>
        <p class="sub" data-t="s3"></p>

        <label data-t="fReq"></label>
        <textarea id="req" placeholder=""></textarea>
        <div class="hint" data-t="hReq"></div>
        <div class="chips" id="chips"></div>

        <div class="btn-row">
          <button class="btn btn-ghost" data-go="p2" data-t="back"></button>
          <button class="btn btn-primary" data-go="p4" data-t="review"></button>
        </div>
      </div>
    </section>

    <!-- STEP 4 : REVIEW -->
    <section class="pane hidden" id="p4">
      <div class="wrap">
        <div class="steps"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></div>
        <div class="kicker" data-t="k4"></div>
        <h2 data-t="t4"></h2>
        <p class="sub" data-t="s4"></p>

        <div class="rev" id="rev"></div>
        <div class="viewer hidden" id="viewer"></div>

        <div class="btn-row">
          <button class="btn btn-ghost" data-go="p2" data-t="edit"></button>
          <button class="btn btn-primary" data-go="p5" data-t="looksGood"></button>
        </div>
      </div>
    </section>

    <!-- STEP 5 : PLANS -->
    <section class="pane hidden" id="p5">
      <div class="wrap">
        <div class="kicker" data-t="k5"></div>
        <h2 data-t="t5"></h2>
        <p class="sub" data-t="s5"></p>
        <div id="plans"></div>

        <div class="paybox" id="paybox">
          <div style="font-size:14px" data-t="payNote"></div>
          <div class="upi"><span id="upiId">yourname@okhdfcbank</span>
            <button class="chip" id="copyUpi" data-t="copy"></button></div>
        </div>

        <label class="consent">
          <input type="checkbox" id="consent">
          <span data-t="consent"></span>
        </label>
        <div class="err" id="e_consent" data-t="consentErr"></div>

        <div style="margin-top:22px">
          <button class="btn btn-wa" id="send" data-t="sendWa"></button>
        </div>
        <div class="hint" style="text-align:center;margin-top:10px" data-t="waHint"></div>

        <div class="btn-row">
          <button class="btn btn-ghost" data-go="p4" data-t="back"></button>
        </div>
      </div>
    </section>

    <!-- DONE -->
    <section class="pane hidden" id="p6">
      <div class="wrap done">
        <div class="tick">✓</div>
        <h2 data-t="doneT"></h2>
        <p class="sub" data-t="doneS"></p>
        <div id="ref" style="font-family:ui-monospace,monospace;font-size:15px;color:var(--maroon)"></div>
        <div style="margin-top:22px">
          <a class="btn btn-wa" id="waLink" href="#" target="_blank" rel="noopener" data-t="openWa"></a>
        </div>
        <div class="hint" style="margin-top:14px" data-t="openWaHint"></div>
        <button class="chip" id="copyMsg" style="margin-top:10px" data-t="copyMsg"></button>
        <div class="btn-row" style="justify-content:center">
          <button class="btn btn-ghost" id="again" data-t="again"></button>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div data-t="brand"></div>
    <div style="margin-top:6px" data-t="footNote"></div>
  </footer>
</div>

<script>
/* ============ CONFIG — edit these three lines only ============ */
var BRAND_WA   = "919106141806";                 // your WhatsApp number, country code, no +
var UPI_ID     = "yourname@okhdfcbank";          // your UPI id
var MAX_MB     = 10;                             // largest upload allowed
var API_URL    = "https://script.google.com/macros/s/AKfycbwG1Li3revS2DTjy7H9lhILADil5rbxYDlb5lwGZU0Ab2FeoQGCoDE4BbDt4pQHcDsX/exec";
/* ============================================================== */

var T = {
 en:{

var L="en", planIdx=0, fileObj=null, fileB64="", fileUrl="", lastMsg="";
function withFile(cb){
  if(!fileObj) return cb("");
  if(fileB64) return cb(fileB64);
  var r=new FileReader();
  r.onload=function(){ fileB64=r.result; cb(fileB64); };
  r.onerror=function(){ cb(""); };
  r.readAsDataURL(fileObj);
}
function makeRef(name){
  var n=new Date(), p=function(x){return ("0"+x).slice(-2)};
  var ymd=String(n.getFullYear()).slice(2)+p(n.getMonth()+1)+p(n.getDate());
  var slug=(name||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,12);
  if(!slug) slug="BIODATA";
  return "ADN-"+ymd+"-"+slug+"-"+p(n.getHours())+p(n.getMinutes());
}
function waUrl(){
  return "https://api.whatsapp.com/send/?phone="+BRAND_WA+
         "&text="+encodeURIComponent(lastMsg)+"&type=phone_number&app_absent=0";
}
function launchWhatsApp(){
  var u=waUrl();
  $("waLink").href=u;
  try{ window.open(u,"_blank","noopener"); }catch(e){}
}
function isMobile(){
  return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)
      || (navigator.maxTouchPoints>1 && /Mac/.test(navigator.platform));
}

$("poster").onerror=function(){ this.onerror=null; this.src=POSTER_DATA; };

/* navigation */
function show(id){
  ["p1","p2","p3","p4","p5","p6"].forEach(function(p){ $(p).classList.toggle("hidden",p!==id); });
  if(id==="p4") buildReview();
  window.scrollTo({top:$("start").offsetTop-10,behavior:"smooth"});
}
function bad(id,cond){ $("e_"+id).classList.toggle("show",cond); return cond; }
function validate(step){
  var f=false;
  if(step==="p1"){
    f = bad("yourName",!$("yourName").value.trim()) | f;
    f = bad("wa",!/^[6-9]\d{9}$/.test($("wa").value.replace(/\D/g,""))) | f;
    f = bad("relation",!$("relation").value) | f;
  }
  if(step==="p2"){
    f = bad("person",!$("person").value.trim()) | f;
    f = bad("gender",!$("gender").value) | f;
    f = bad("file",!fileObj) | f;
  }
  return !f;
}
document.querySelectorAll("[data-go]").forEach(function(b){
  b.onclick=function(){
    var to=b.getAttribute("data-go"), from=b.closest(".pane").id;
    var order=["p1","p2","p3","p4","p5"];
    if(order.indexOf(to)>order.indexOf(from) && !validate(from)) return;
    show(to);
  };
});

/* file handling */
$("drop").onclick=function(){ $("file").click(); };
$("file").onchange=function(){
  var f=this.files[0]; if(!f) return;
  var e=$("e_file");
  if(f.size>MAX_MB*1024*1024){
    e.textContent=T[L].sizeErr.replace("{n}",(f.size/1048576).toFixed(1))+" "+T[L].sizeTip;
    e.classList.add("show");
    this.value=""; fileObj=null; fileB64="";
    $("filebar").classList.remove("show");
    return;
  }
  fileObj=f; if(fileUrl) URL.revokeObjectURL(fileUrl); fileUrl=URL.createObjectURL(f);
  $("fileName").textContent=f.name;
  $("filebar").classList.add("show");
  e.textContent=T[L].fileErr; e.classList.remove("show");
  var r=new FileReader(); r.onload=function(){ fileB64=r.result; }; r.readAsDataURL(f);
};
$("fileClear").onclick=function(){
  fileObj=null; fileB64=""; $("file").value=""; $("filebar").classList.remove("show");
  if(fileUrl){URL.revokeObjectURL(fileUrl);fileUrl="";}
};

/* review + preview */
function data(){
  var d=T[L];
  return {
    yourName:$("yourName").value.trim(), wa:$("wa").value.replace(/\D/g,""),
    relation:$("relation").value, person:$("person").value.trim(),
    gender:$("gender").value, birth:$("birth").value, city:$("city").value.trim(),
    req:$("req").value.trim(), plan:d.plans[planIdx].n+" — "+d.plans[planIdx].p,
    file:fileObj?fileObj.name:""
  };
}
function buildReview(){
  var d=T[L], v=data();
  var rows=[[d.fPerson,v.person],[d.fGender,v.gender],[d.fBirth,v.birth],[d.fCity,v.city],
            [d.fYourName,v.yourName],[d.fRelation,v.relation],[d.fWa,"+91 "+v.wa],
            [d.fReq,v.req],[d.fFile,v.file]];
  $("rev").innerHTML=rows.filter(function(r){return r[1]})
    .map(function(r){return '<div class="row"><span class="k">'+r[0].replace(" *","")+
      '</span><span class="v">'+esc(r[1])+'</span></div>'}).join("");
  var vw=$("viewer");
  if(fileObj){
    vw.classList.remove("hidden");
    var isPdf=/pdf/i.test(fileObj.type)||/\.pdf$/i.test(fileObj.name);
    var isImg=/^image\//i.test(fileObj.type);
    vw.innerHTML = isPdf ? '<iframe src="'+fileUrl+'#toolbar=0" title="Biodata preview"></iframe>'
      : isImg ? '<img src="'+fileUrl+'" alt="Biodata preview">'
      : '<div style="padding:34px 18px;text-align:center">'+
        '<div style="font-size:30px;color:var(--maroon)">&#128196;</div>'+
        '<div style="margin-top:8px;font-size:15px">'+esc(fileObj.name)+'</div>'+
        '<div class="hint">'+T[L].noPreview+'</div></div>';
  } else vw.classList.add("hidden");
}
function esc(s){return String(s).replace(/[<>&]/g,function(c){return {"<":"&lt;",">":"&gt;","&":"&amp;"}[c]})}

/* copy upi */
$("copyUpi").onclick=function(){
  navigator.clipboard&&navigator.clipboard.writeText(UPI_ID);
  this.textContent="✓";
  var self=this; setTimeout(function(){ self.textContent=T[L].copy; },1500);
};

/* submit */
$("send").onclick=function(){
  if(!$("consent").checked){ $("e_consent").classList.add("show"); return; }
  $("e_consent").classList.remove("show");
  var d=T[L], v=data();
  var ref=makeRef(v.person);

  var m="*"+d.mTitle+"*\n"+
    "\n"+d.mFor+": "+v.person+
    (v.gender?" ("+v.gender+(v.birth?", "+v.birth:"")+(v.city?", "+v.city:"")+")":"")+
    "\n"+d.mBy+": "+v.yourName+" ("+v.relation+")"+
    "\n"+d.mWa+": +91 "+v.wa+
    (v.req?"\n"+d.mReq+": "+v.req:"")+
    "\n"+d.mPlan+": "+v.plan+
    "\n"+d.mRef+": "+ref;

  lastMsg=m;
  $("ref").textContent=d.mRef+": "+ref;

  var btn=this, done=false, label=btn.textContent;
  function finish(){
    if(done) return; done=true;
    btn.disabled=false; btn.textContent=label;
    show("p6"); launchWhatsApp();
  }

  if(!API_URL) return finish();

  btn.disabled=true; btn.textContent=d.sending;
  setTimeout(finish,25000);                    // never leave them stuck
  withFile(function(b64){
    try{
      fetch(API_URL,{method:"POST",mode:"no-cors",
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify(Object.assign({},v,{ref:ref,lang:L,file:b64,fileName:v.file}))
      }).then(finish,finish);
    }catch(e){ finish(); }
  });
};

$("copyMsg").onclick=function(){
  var self=this;
  function done(){ self.textContent=T[L].copied;
    setTimeout(function(){ self.textContent=T[L].copyMsg; },1600); }
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(lastMsg).then(done,fallback);
  } else fallback();
  function fallback(){
    var ta=document.createElement("textarea");
    ta.value=lastMsg; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); done(); }catch(e){ alert(lastMsg); }
    document.body.removeChild(ta);
  }
};
$("again").onclick=function(){ location.reload(); };

(function(){
  var box=$("petals"); if(!box) return;
  if(window.matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  for(var i=0;i<14;i++){
    var p=document.createElement("i");
    p.className = i%2 ? "petal" : "petal g";
    p.style.left=(Math.random()*100)+"%";
    p.style.animationDuration=(13+Math.random()*11)+"s";
    p.style.animationDelay=(-Math.random()*20)+"s";
    p.style.opacity=(0.25+Math.random()*0.35);
    p.style.transform="scale("+(0.7+Math.random()*0.8)+")";
    box.appendChild(p);
  }
})();

apply("en");
</script>
