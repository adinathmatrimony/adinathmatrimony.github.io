<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adinath Matrimony — Share a biodata</title>
<meta name="description" content="Share a biodata with Adinath Matrimony. We match within our community, privately and with respect. No public listing.">
<meta name="theme-color" content="#A5152F">
<meta property="og:type" content="website">
<meta property="og:title" content="Adinath Matrimony">
<meta property="og:description" content="More than matches — a community for life. Share a biodata privately.">
<meta property="og:image" content="https://adinathmatrimony.github.io/first-page.jpg">
<meta property="og:url" content="https://adinathmatrimony.github.io/">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500;600&family=Inter:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&family=Noto+Sans+Gujarati:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --maroon:#A5152F; --maroon-soft:#C0304A; --gold:#C0912E; --gold-soft:#E5C27A;
  --bg:#FFFAF3; --surface:#FFFFFF; --surface-2:#FBF0E4;
  --text:#2A1A20; --muted:#6E5A60; --line:#E6D8CE;
  --radius:14px;
  --paper:#FFFCF6; --ink:#3A1018; --gold-ink:#9A6B1E; --band:#8E0E2A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16100F; --surface:#221917; --surface-2:#2C211F;
    --text:#F3E9E2; --muted:#B49C95; --line:#3A2C29;
    --maroon:#D9819C; --maroon-soft:#C96A88; --gold:#E3C179;
  }
}
:root[data-theme="dark"]{
  --bg:#16100F; --surface:#221917; --surface-2:#2C211F;
  --text:#F3E9E2; --muted:#B49C95; --line:#3A2C29;
  --maroon:#D9819C; --maroon-soft:#C96A88; --gold:#E3C179;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:Inter,"Noto Sans Devanagari","Noto Sans Gujarati",system-ui,sans-serif;
  font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
body[data-lang="hi"]{font-family:"Noto Sans Devanagari",Inter,sans-serif}
body[data-lang="gu"]{font-family:"Noto Sans Gujarati",Inter,sans-serif}
img{max-width:100%}
h1,h2,h3{font-variant-numeric:lining-nums;font-family:"Cormorant Garamond","Noto Sans Devanagari","Noto Sans Gujarati",serif;font-weight:600;line-height:1.25;margin:0}
.wrap{width:100%;max-width:640px;margin:0 auto;padding:0 20px}

/* ---------- language gate ---------- */
#gate{position:absolute;inset:0;min-height:100%;z-index:50;overflow-y:auto;
  background:#F7E3D4;display:flex;align-items:center;justify-content:center;
  padding:0 0 calc(22px + env(safe-area-inset-bottom,0px))}
.art{position:relative;width:100%;max-width:1210px;margin:0 auto}
.poster{display:block;width:100%;height:auto}
#gate .card{background:var(--paper);border-radius:12px;
  box-shadow:0 16px 44px rgba(90,20,35,.22);
  outline:1px solid var(--gold);outline-offset:-7px}
.gate-pick{padding:22px 20px 24px;text-align:center}
.gate-pick h1{font-size:23px;color:var(--maroon);font-weight:500;line-height:1.2}
.gate-pick p{color:var(--muted);font-size:13.5px;margin:6px 0 16px}
.langbtn{display:flex;align-items:center;justify-content:space-between;width:100%;
  margin-top:9px;padding:14px 17px;border:1px solid var(--line);background:transparent;
  border-radius:6px;color:var(--ink);font-size:17px;cursor:pointer;
  font-family:inherit;transition:border-color .15s,background .15s}
.langbtn:hover,.langbtn:focus-visible{border-color:var(--gold);background:#FFF9F0}
.langbtn small{color:var(--gold-ink);font-size:12.5px}

/* phones: artwork fills the screen, card floats in the middle */
@media (max-width:859px){
  #gate{padding:0;align-items:center;overflow:hidden}
  .art{position:fixed;inset:0;max-width:none;display:flex;
    align-items:center;justify-content:center}
  .poster{position:absolute;inset:0;width:100%;height:100%;
    max-height:none;object-fit:cover;object-position:50% 18%}
  .art::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,
      rgba(255,248,238,.10) 0%,
      rgba(255,248,238,.42) 42%,
      rgba(255,248,238,.42) 72%,
      rgba(110,11,32,.10) 100%)}
  #gate .card{position:relative;z-index:2;width:min(90%,400px);margin:0;
    box-shadow:0 20px 50px rgba(60,10,22,.34)}
  .gate-pick{padding:24px 20px 26px}
}
@media (max-height:640px) and (max-width:859px){
  .gate-pick{padding:18px 18px 20px}
  .gate-pick h1{font-size:21px}
  .langbtn{padding:12px 15px;margin-top:7px}
}

/* laptops: the live card sits exactly where the printed one was */
@media (min-width:860px){
  .art{width:min(100%,calc(100svh * 0.93));max-height:100svh}
  #gate .card{position:absolute;left:27.9%;width:42.3%;
    top:56.7%;transform:translateY(-50%)}
  .gate-pick{padding:26px 24px 28px}
  .gate-pick h1{font-size:26px}
}

/* ---------- hero ---------- */
#app{display:none}
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  padding:46px 20px 108px;overflow:hidden;
  background:
    radial-gradient(60% 40% at 88% 8%, rgba(214,73,104,.16) 0%, transparent 60%),
    radial-gradient(55% 40% at 8% 22%, rgba(214,73,104,.13) 0%, transparent 60%),
    radial-gradient(70% 45% at 50% 30%, #FFFFFF 0%, #FFFDF9 45%, #FDF0E2 100%)}
#petals{position:absolute;inset:0;z-index:0;pointer-events:none}
.petal{position:absolute;top:-8%;width:10px;height:14px;border-radius:60% 0 60% 0;
  background:var(--maroon);opacity:.16;animation:fall linear infinite}
.petal.g{background:var(--gold)}
@keyframes fall{0%{transform:translate3d(0,-12vh,0) rotate(0)}
  100%{transform:translate3d(34px,116vh,0) rotate(400deg)}}
.hero .inner{position:relative;z-index:2;max-width:520px;width:100%;
  animation:rise .9s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.logo-slot{width:min(76vw,320px);margin:0 auto 4px}
.logo-slot img{width:100%;height:auto;display:block}
.hero h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hero .divider{width:88px;height:9px;margin:14px auto 16px;opacity:.9}
.hero p{color:var(--muted);margin:0 auto 26px;max-width:36ch;font-size:15px}
.trust{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 22px;
  margin-top:30px;max-width:460px}
.trust div{display:flex;flex-direction:column;align-items:center;gap:6px;
  width:78px;font-size:11px;line-height:1.35;color:var(--muted)}
.trust span{width:38px;height:38px;border-radius:50%;background:#FFF6E9;
  border:1px solid var(--gold-soft);display:flex;align-items:center;
  justify-content:center;color:var(--maroon);font-size:17px}
.band{position:absolute;left:0;right:0;bottom:0;
  background:linear-gradient(180deg,var(--band) 0%,#6E0B20 100%);
  color:#F6DDA8;font-size:11.5px;letter-spacing:.08em;text-align:center;
  padding:13px 18px calc(13px + env(safe-area-inset-bottom,0px));
  border-top:1px solid rgba(246,221,168,.35)}
.scrolldown{position:absolute;bottom:calc(64px + env(safe-area-inset-bottom,0px));
  left:50%;transform:translateX(-50%);color:var(--maroon);font-size:12px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  text-decoration:none;opacity:.75}
.chev{width:12px;height:12px;border-right:1.5px solid var(--maroon);
  border-bottom:1.5px solid var(--maroon);transform:rotate(45deg);
  animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:rotate(45deg) translate(0,0)}
  50%{transform:rotate(45deg) translate(3px,3px)}}
@media (prefers-reduced-motion:reduce){
  .chev,.petal{animation:none}.petal{display:none}.hero .inner{animation:none}}

/* ---------- buttons ---------- */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:15px 26px;border-radius:999px;border:none;cursor:pointer;
  font-family:inherit;font-size:16px;font-weight:500;transition:opacity .15s,transform .1s}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--maroon);color:#fff}
:root[data-theme="dark"] .btn-primary,
@media (prefers-color-scheme:dark){}
.btn-ghost{background:transparent;color:var(--maroon);border:1px solid var(--line)}
.btn-wa{background:#1FA855;color:#fff;width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:10px;margin-top:26px}
.btn-row .btn{flex:1}

/* ---------- form ---------- */
section.pane{padding:56px 0 72px}
/* two columns from tablet up */
@media (min-width:960px){
  #app{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);align-items:start}
  .hero{position:sticky;top:0;height:100svh;min-height:0;padding:40px 28px 70px;
    border-right:1px solid var(--line)}
  .hero .trust{margin-top:24px}
  .panel{min-height:100svh;background:var(--surface)}
  section.pane{padding:34px 0 64px}
  .wrap{max-width:560px;padding:0 34px}
}
.panel{background:var(--bg)}
.mini-logo{height:30px;width:auto;margin-left:auto;display:none}
@media (min-width:960px){ .mini-logo{display:block} .langswitch{justify-content:flex-start;gap:14px} }

/* numbered progress */
.steps{display:flex;align-items:flex-start;margin:0 0 24px}
.steps .st{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;
  position:relative;font-size:11px;color:var(--muted);text-align:center;line-height:1.3}
.steps .st b{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;background:var(--surface-2);border:1px solid var(--line);
  color:var(--muted);font-weight:500;font-size:13px;position:relative;z-index:2}
.steps .st.on b{background:var(--maroon);border-color:var(--maroon);color:#fff}
.steps .st.on{color:var(--maroon)}
.steps .st.done b{background:#fff;border-color:var(--maroon);color:var(--maroon)}
.steps .st::before{content:"";position:absolute;top:15px;left:-50%;width:100%;
  height:1px;background:var(--line);z-index:1}
.steps .st:first-child::before{display:none}

.backlink{display:inline-flex;align-items:center;gap:8px;background:none;border:none;
  padding:2px 0 16px;margin-top:-4px;color:var(--ink);font-family:inherit;font-size:15px;cursor:pointer}
.backlink:hover{color:var(--maroon)}

.phone{display:flex;gap:9px}
.phone span{flex:0 0 auto;display:flex;align-items:center;padding:0 15px;
  border:1px solid var(--line);border-radius:var(--radius);background:var(--surface-2);
  color:var(--muted);font-size:16px}

.btn.wide{width:100%;margin-top:26px}
.arw{font-style:normal;margin-left:2px}

.safenote{display:flex;gap:12px;align-items:flex-start;margin-top:16px;padding:14px 16px;
  background:var(--surface-2);border-radius:var(--radius)}
.safenote svg{flex:0 0 auto;color:var(--gold-ink);margin-top:1px}
.safenote b{display:block;font-weight:500;font-size:14px;color:var(--ink)}
.safenote span{font-size:13px;color:var(--muted)}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
h2{font-size:clamp(23px,5.5vw,30px)}
.sub{color:var(--muted);margin:8px 0 26px}
label{display:block;font-size:14px;font-weight:500;margin:18px 0 7px}
.pane label > span.req{color:var(--maroon)}
input,select,textarea{width:100%;padding:14px 15px;border:1px solid var(--line);
  border-radius:var(--radius);background:var(--surface);color:var(--text);
  font-family:inherit;font-size:16px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--maroon-soft);outline-offset:1px}
.langbtn:focus-visible,.btn:focus-visible,.plan:focus-within{outline:2px solid var(--maroon-soft);outline-offset:2px}
textarea{min-height:120px;resize:vertical}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.other{margin-top:9px;animation:drop .22s ease-out}
@keyframes drop{from{opacity:0;transform:translateY(-4px)}}
.err{font-size:13px;color:#C0392B;margin-top:6px;display:none}
.err.show{display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{padding:8px 14px;border:1px dashed var(--line);border-radius:999px;
  background:transparent;color:var(--muted);font-size:13px;cursor:pointer;font-family:inherit}
.chip:hover{border-color:var(--maroon);color:var(--maroon)}
.drop{border:1.5px dashed var(--line);border-radius:var(--radius);padding:28px 18px;
  text-align:center;cursor:pointer;background:var(--surface)}
.drop:hover{border-color:var(--maroon)}
.drop .big{font-size:28px;color:var(--maroon)}
.drop b{display:block;margin-top:8px;font-weight:500}
.filebar{display:none;align-items:center;gap:12px;margin-top:12px;padding:12px 14px;
  border:1px solid var(--line);border-radius:var(--radius);background:var(--surface-2)}
.filebar.show{display:flex}
.filebar .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.filebar button{background:none;border:none;color:var(--maroon);cursor:pointer;font-family:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media (max-width:480px){.two{grid-template-columns:1fr}}

/* ---------- review ---------- */
.rev{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);
  overflow:hidden;margin-bottom:18px}
.rev .row{display:flex;gap:14px;padding:13px 16px;border-bottom:1px solid var(--line);font-size:15px}
.rev .row:last-child{border-bottom:none}
.rev .row .k{color:var(--muted);flex:0 0 40%;font-size:14px}
.rev .row .v{flex:1;word-break:break-word}
.viewer{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  background:var(--surface-2);margin-bottom:18px}
.viewer iframe,.viewer img{display:block;width:100%;height:420px;border:none;object-fit:contain;background:var(--surface-2)}

/* ---------- plans ---------- */
.plan{display:block;border:1.5px solid var(--line);border-radius:var(--radius);
  background:var(--surface);padding:17px 18px;margin-bottom:11px;cursor:pointer;
  position:relative;transition:border-color .15s,background .15s}
.plan.sel{border-color:var(--maroon);background:var(--surface-2)}
.plan .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.plan .nm{font-weight:500;font-size:17px}
.plan .pr{font-family:Inter,sans-serif;font-size:19px;font-weight:600;
  color:var(--maroon);white-space:nowrap;letter-spacing:-.01em;
  font-variant-numeric:lining-nums tabular-nums}
.plan .ds{color:var(--muted);font-size:14px;margin-top:5px}
.tag{position:absolute;top:12px;right:14px;background:#FBEFD8;color:var(--gold-ink);
  font-size:10.5px;font-weight:500;padding:3px 9px;border-radius:999px;
  border:1px solid var(--gold-soft)}
.plan .top{padding-right:78px}
.plan input{position:absolute;opacity:0;pointer-events:none}
.paybox{border:1px solid var(--line);border-radius:var(--radius);padding:16px;
  background:var(--surface-2);margin-top:6px;display:none}
.paybox.show{display:block}
.consent{display:flex;gap:11px;align-items:flex-start;margin:24px 0 0;
  font-size:13.5px;line-height:1.55;color:var(--muted);cursor:pointer}
.consent span{color:var(--muted)}
.consent input{width:19px;height:19px;flex:0 0 auto;margin-top:2px;accent-color:var(--maroon)}

/* ---------- done ---------- */
.done{text-align:center;padding:80px 0 90px}
.refbox{display:inline-flex;flex-direction:column;gap:3px;margin:4px auto 6px;
  padding:13px 24px;border:1px dashed var(--gold);border-radius:10px;
  background:var(--surface-2)}
.refbox span{font-size:11.5px;color:var(--muted)}
.refbox b{font-family:ui-monospace,monospace;font-size:15px;color:var(--maroon);font-weight:500}
.done .tick{width:66px;height:66px;border-radius:50%;background:var(--maroon);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 22px}
footer{text-align:center;padding:34px 16px calc(40px + env(safe-area-inset-bottom,0px));
  color:var(--muted);font-size:13px;border-top:1px solid var(--line);
  background:var(--surface-2)}
.f-brand{font-family:"Cormorant Garamond",serif;font-size:22px;color:var(--maroon)}
.f-note{margin-top:5px}
.f-sep{width:58px;height:1px;background:var(--gold-soft);margin:20px auto}
.f-title{font-family:"Cormorant Garamond",serif;font-size:24px;color:var(--maroon);
  margin-bottom:4px}
.f-sub{font-size:13px;color:var(--muted);margin-bottom:14px}
.contact{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.contact a,.contact .copybtn{flex:1 1 104px;max-width:150px;display:flex;flex-direction:column;
  align-items:center;gap:7px;text-decoration:none;color:var(--ink);
  padding:14px 8px;border-radius:10px;transition:background .15s}
.contact .copybtn{border:none;background:none;font-family:inherit;cursor:pointer}
.contact a:hover,.contact .copybtn:hover{background:#FFF7EC}
.contact .copied em{color:var(--maroon)}
.orb{width:46px;height:46px;border-radius:50%;background:var(--maroon);
  color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(165,21,47,.25)}
.contact a .orb{background:#1FA855;box-shadow:0 4px 12px rgba(31,168,85,.25)}
.contact b{font-weight:500;font-size:13.5px}
.contact em{font-style:normal;font-size:11.5px;color:var(--muted);
  word-break:break-word;line-height:1.35}
@media (min-width:860px){ .contact{flex-direction:row;justify-content:center;gap:26px} }
.langswitch{position:sticky;top:0;z-index:30;background:rgba(255,253,249,.92);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  display:flex;justify-content:flex-end;
  padding:7px 14px;padding-top:calc(7px + env(safe-area-inset-top,0px))}
.langswitch select{width:auto;padding:5px 9px;font-size:13px;border-radius:999px;
  border-color:var(--line);color:var(--muted);background:transparent}
.hidden{display:none !important}
</style>
</head>
<body>

<div id="gate">
  <div class="art">
    <img id="poster" class="poster" src="first-page.jpg" alt="Adinath Matrimony"
           width="1210" height="1300" decoding="async" fetchpriority="high">
    <div class="card">
      <div class="gate-pick">
        <h1>Choose your language</h1>
        <p>अपनी भाषा चुनें &nbsp;·&nbsp; તમારી ભાષા પસંદ કરો</p>
        <button class="langbtn" data-set="en"><span>English</span><small>English &rsaquo;</small></button>
        <button class="langbtn" data-set="hi"><span>हिन्दी</span><small>Hindi &rsaquo;</small></button>
        <button class="langbtn" data-set="gu"><span>ગુજરાતી</span><small>Gujarati &rsaquo;</small></button>
      </div>
    </div>
  </div>
</div>

<div id="app">
  <header class="hero">
    <div id="petals" aria-hidden="true"></div>

    <div class="inner">
      <div class="logo-slot"><img id="logo" src="logo.png" alt="Adinath Matrimony"></div>
      <h1 data-t="brand"></h1>
      <svg class="divider" viewBox="0 0 88 9" aria-hidden="true">
        <path d="M0 4.5h32M56 4.5h32" stroke="#C0912E" stroke-width="1"/>
        <path d="M44 0.5 48.5 4.5 44 8.5 39.5 4.5Z" fill="#A5152F"/>
      </svg>
      <p data-t="heroSub"></p>
      <a class="btn btn-primary" href="#start" data-t="heroCta"></a>

      <div class="trust" id="trust"></div>
    </div>

    <a class="scrolldown" href="#start"><span data-t="scroll"></span><i class="chev"></i></a>
    <div class="band" data-t="motto"></div>
  </header>

  <div class="panel">
  <div class="langswitch">
    <select id="langSel" aria-label="Language">
      <option value="en">English</option><option value="hi">हिन्दी</option><option value="gu">ગુજરાતી</option>
    </select>
    <img class="mini-logo" id="logo2" src="logo.png" alt="">
  </div>

  <main id="start">
    <!-- STEP 1 -->
    <section class="pane" id="p1">
      <div class="wrap">
        <div class="steps" data-step="1"></div>
        <div class="kicker" data-t="k1"></div>
        <h2 data-t="t1"></h2>
        <p class="sub" data-t="s1"></p>

        <label data-t="fYourName"></label>
        <input id="yourName" autocomplete="name">
        <div class="err" id="e_yourName" data-t="reqErr"></div>

var L="en", planIdx=0, fileObj=null, fileB64="", fileUrl="", lastMsg="";
var FIELDS=["yourName","wa","relation","relationOther","person","gender","birth","city","community","communityOther","req"];
function saveDraft(){
  try{
    var o={lang:L,plan:planIdx};
    function isOther(sel){ return sel.selectedIndex === sel.options.length-1 && sel.selectedIndex>0; }
function syncOther(selId,inpId){
  var sel=$(selId), inp=$(inpId);
  var show=isOther(sel);
  inp.classList.toggle("hidden",!show);
  if(!show) inp.value="";
}
["relation","community"].forEach(function(id){
  $(id).addEventListener("change",function(){ syncOther(id,id+"Other"); saveDraft(); });
});

FIELDS.forEach(function(id){ o[id]=$(id).value; });
    localStorage.setItem("adinath_draft", JSON.stringify(o));
  }catch(e){}
}
function loadDraft(){
  try{
    var o=JSON.parse(localStorage.getItem("adinath_draft")||"null");
    if(!o) return;
    function isOther(sel){ return sel.selectedIndex === sel.options.length-1 && sel.selectedIndex>0; }
function syncOther(selId,inpId){
  var sel=$(selId), inp=$(inpId);
  var show=isOther(sel);
  inp.classList.toggle("hidden",!show);
  if(!show) inp.value="";
}
["relation","community"].forEach(function(id){
  $(id).addEventListener("change",function(){ syncOther(id,id+"Other"); saveDraft(); });
});

FIELDS.forEach(function(id){ if(o[id]) $(id).value=o[id]; });
    if(typeof o.plan==="number") planIdx=o.plan;
    if(o.lang) return o.lang;
  }catch(e){}
}
function clearDraft(){ try{ localStorage.removeItem("adinath_draft"); }catch(e){} }

function withFile(cb){
  if(!fileObj) return cb("");
  if(fileB64) return cb(fileB64);
  var r=new FileReader();
  r.onload=function(){ fileB64=r.result; cb(fileB64); };
  r.onerror=function(){ cb(""); };
  r.readAsDataURL(fileObj);
}
function makeRef(name){
  var n=new Date(), p=function(x){return ("0"+x).slice(-2)};
  var ymd=String(n.getFullYear()).slice(2)+p(n.getMonth()+1)+p(n.getDate());
  var slug=(name||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,12);
  if(!slug) slug="BIODATA";
  return "ADN-"+ymd+"-"+slug+"-"+p(n.getHours())+p(n.getMinutes());
}
function waUrl(){
  return "https://api.whatsapp.com/send/?phone="+BRAND_WA+
         "&text="+encodeURIComponent(lastMsg)+"&type=phone_number&app_absent=0";
}
function launchWhatsApp(){
  var u=waUrl();
  $("waLink").href=u;
  try{ window.open(u,"_blank","noopener"); }catch(e){}
}
function isMobile(){
  return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)
      || (navigator.maxTouchPoints>1 && /Mac/.test(navigator.platform));
}
var $=function(id){return document.getElementById(id)};

function apply(lang){
  L=lang; var d=T[lang];
  document.body.setAttribute("data-lang",lang);
  document.documentElement.setAttribute("lang",lang);
  $("langSel").value=lang;
  document.querySelectorAll("[data-t]").forEach(function(el){
    var v=d[el.getAttribute("data-t")]; if(typeof v==="string") el.textContent=v;
  });
  fill("relation",d.rel); fill("gender",d.gen); fill("community",d.comm);
  $("chips").innerHTML=d.chips.map(function(c){return '<button type="button" class="chip">'+c+'</button>'}).join("");
  $("chips").querySelectorAll(".chip").forEach(function(b){
    b.onclick=function(){
      var t=$("req"), txt=b.textContent;
      if(t.value.indexOf(txt)>-1) return;
      t.value=(t.value?t.value.replace(/[,\s]+$/,"")+", ":"")+txt; t.focus();
    };
  });
  $("plans").innerHTML=d.plans.map(function(p,i){
    return '<label class="plan'+(i===planIdx?' sel':'')+'" data-i="'+i+'">'+
      (p.tag?'<span class="tag">'+p.tag+'</span>':'')+
      '<input type="radio" name="plan" '+(i===planIdx?'checked':'')+'>'+
      '<div class="top"><span class="nm">'+p.n+'</span><span class="pr">'+p.p+'</span></div>'+
      '<div class="ds">'+p.d+'</div></label>';
  }).join("");
  $("plans").querySelectorAll(".plan").forEach(function(el){
    el.onclick=function(){ planIdx=+el.getAttribute("data-i"); apply(L); };
  });
  document.querySelectorAll(".steps").forEach(function(el){
    var cur=+el.getAttribute("data-step");
    el.innerHTML=d.stepNames.map(function(nm,i){
      var n=i+1, cls = n===cur ? " on" : (n<cur ? " done" : "");
      return '<div class="st'+cls+'"><b>'+(n<cur?"\u2713":n)+'</b>'+nm+'</div>';
    }).join("");
  });
  $("yourName").placeholder=d.phYourName;
  $("person").placeholder=d.phPerson;
  $("city").placeholder=d.phCity;
  $("req").placeholder=d.phReq;
  $("relationOther").placeholder=d.phOther;
  $("communityOther").placeholder=d.phOther;
  syncOther("relation","relationOther"); syncOther("community","communityOther");
  $("trust").innerHTML=d.trust.map(function(t){
    return '<div><span>'+t[0]+'</span>'+t[1].replace("\n","<br>")+'</div>';
  }).join("");
  $("paybox").classList.toggle("show", planIdx>0);
  var hi="https://api.whatsapp.com/send/?phone="+BRAND_WA+"&text="+
          encodeURIComponent(d.waHello)+"&type=phone_number&app_absent=0";
  $("cWa").href=hi;
}
function fill(id,arr){
  var s=$(id), cur=s.selectedIndex;
  s.innerHTML=arr.map(function(o,i){return '<option value="'+(i===0?"":o)+'">'+o+'</option>'}).join("");
  if(cur>0) s.selectedIndex=cur;
}
document.querySelectorAll(".langbtn").forEach(function(b){
  b.onclick=function(){ apply(b.getAttribute("data-set")); saveDraft();
    $("gate").remove(); $("app").style.display="block"; };
});
$("langSel").onchange=function(){ apply(this.value); };

/* navigation */
function show(id){
  ["p1","p2","p3","p4","p5","p6"].forEach(function(p){ $(p).classList.toggle("hidden",p!==id); });
  if(id==="p4") buildReview();
  var bar=document.querySelector(".langswitch");
  var off=(bar?bar.offsetHeight:0)+8;
  window.scrollTo({top:Math.max(0,$("start").offsetTop-off),behavior:"smooth"});
}
function bad(id,cond){ $("e_"+id).classList.toggle("show",cond); return cond; }
function validate(step){
  var f=false;
  if(step==="p1"){
    f = bad("yourName",!$("yourName").value.trim()) | f;
    f = bad("wa",!/^[6-9]\d{9}$/.test($("wa").value.replace(/\D/g,""))) | f;
    f = bad("relation",!$("relation").value) | f;
  }
  if(step==="p2"){
    f = bad("person",!$("person").value.trim()) | f;
    f = bad("gender",!$("gender").value) | f;
    f = bad("file",!fileObj) | f;
  }
  return !f;
}
function isOther(sel){ return sel.selectedIndex === sel.options.length-1 && sel.selectedIndex>0; }
function syncOther(selId,inpId){
  var sel=$(selId), inp=$(inpId);
  var show=isOther(sel);
  inp.classList.toggle("hidden",!show);
  if(!show) inp.value="";
}
["relation","community"].forEach(function(id){
  $(id).addEventListener("change",function(){ syncOther(id,id+"Other"); saveDraft(); });
});

FIELDS.forEach(function(id){
  var el=$(id); if(el) el.addEventListener("change",saveDraft);
});

document.querySelectorAll("[data-go]").forEach(function(b){
  b.onclick=function(){
    var to=b.getAttribute("data-go"), from=b.closest(".pane").id;
    var order=["p1","p2","p3","p4","p5"];
    if(order.indexOf(to)>order.indexOf(from) && !validate(from)){
      var bad=$(from).querySelector(".err.show");
      if(bad) bad.scrollIntoView({behavior:"smooth",block:"center"});
      return;
    }
    saveDraft();
    show(to);
  };
});

/* file handling */
$("drop").onclick=function(){ $("file").click(); };
$("file").onchange=function(){
  var f=this.files[0]; if(!f) return;
  var e=$("e_file");
  if(f.size>MAX_MB*1024*1024){
    e.textContent=T[L].sizeErr.replace("{n}",(f.size/1048576).toFixed(1))+" "+T[L].sizeTip;
    e.classList.add("show");
    this.value=""; fileObj=null; fileB64="";
    $("filebar").classList.remove("show");
    return;
  }
  fileObj=f; if(fileUrl) URL.revokeObjectURL(fileUrl); fileUrl=URL.createObjectURL(f);
  $("fileName").textContent=f.name;
  $("filebar").classList.add("show");
  e.textContent=T[L].fileErr; e.classList.remove("show");
  var r=new FileReader(); r.onload=function(){ fileB64=r.result; }; r.readAsDataURL(f);
};
$("fileClear").onclick=function(){
  fileObj=null; fileB64=""; $("file").value=""; $("filebar").classList.remove("show");
  if(fileUrl){URL.revokeObjectURL(fileUrl);fileUrl="";}
};

/* review + preview */
function pick(id){
  var sel=$(id), extra=$(id+"Other");
  if(isOther(sel) && extra.value.trim()) return extra.value.trim();
  return sel.value;
}
function data(){
  var d=T[L];
  return {
    yourName:$("yourName").value.trim(), wa:$("wa").value.replace(/\D/g,""),
    relation:pick("relation"), person:$("person").value.trim(),
    gender:$("gender").value, birth:$("birth").value, city:$("city").value.trim(),
    community:pick("community"), req:$("req").value.trim(), plan:d.plans[planIdx].n+" — "+d.plans[planIdx].p,
    file:fileObj?fileObj.name:""
  };
}
function buildReview(){
  var d=T[L], v=data();
  var rows=[[d.fPerson,v.person],[d.fGender,v.gender],[d.fBirth,v.birth],[d.fCity,v.city],[d.fCommunity,v.community],
            [d.fYourName,v.yourName],[d.fRelation,v.relation],[d.fWa,"+91 "+v.wa],
            [d.fReq,v.req],[d.fFile,v.file]];
  $("rev").innerHTML=rows.filter(function(r){return r[1]})
    .map(function(r){return '<div class="row"><span class="k">'+r[0].replace(" *","")+
      '</span><span class="v">'+esc(r[1])+'</span></div>'}).join("");
  var vw=$("viewer");
  if(fileObj){
    vw.classList.remove("hidden");
    var isPdf=/pdf/i.test(fileObj.type)||/\.pdf$/i.test(fileObj.name);
    var isImg=/^image\//i.test(fileObj.type);
    vw.innerHTML = isPdf ? '<iframe src="'+fileUrl+'#toolbar=0" title="Biodata preview"></iframe>'
      : isImg ? '<img src="'+fileUrl+'" alt="Biodata preview">'
      : '<div style="padding:34px 18px;text-align:center">'+
        '<div style="font-size:30px;color:var(--maroon)">&#128196;</div>'+
        '<div style="margin-top:8px;font-size:15px">'+esc(fileObj.name)+'</div>'+
        '<div class="hint">'+T[L].noPreview+'</div></div>';
  } else vw.classList.add("hidden");
}
function esc(s){return String(s).replace(/[<>&]/g,function(c){return {"<":"&lt;",">":"&gt;","&":"&amp;"}[c]})}

/* submit */
$("send").onclick=function(){
  if(!$("consent").checked){ $("e_consent").classList.add("show"); return; }
  $("e_consent").classList.remove("show");
  var d=T[L], v=data();
  var ref=makeRef(v.person);

  var m="*"+d.mTitle+"*\n"+
    "\n"+d.mFor+": "+v.person+
    (v.gender?" ("+v.gender+(v.birth?", "+v.birth:"")+(v.city?", "+v.city:"")+(v.community?", "+v.community:"")+")":"")+
    "\n"+d.mBy+": "+v.yourName+" ("+v.relation+")"+
    "\n"+d.mWa+": +91 "+v.wa+
    (v.req?"\n"+d.mReq+": "+v.req:"")+
    "\n"+d.mPlan+": "+v.plan+
    "\n"+d.mRef+": "+ref;

  lastMsg=m;
  $("ref").textContent=ref;

  var btn=this, done=false, label=btn.textContent;
  function finish(){
    if(done) return; done=true;
    btn.disabled=false; btn.textContent=label;
    clearDraft(); show("p6"); launchWhatsApp();
  }

  if(!API_URL) return finish();

  btn.disabled=true; btn.textContent=d.sending;
  setTimeout(finish,25000);                    // never leave them stuck
  withFile(function(b64){
    try{
      fetch(API_URL,{method:"POST",mode:"no-cors",
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify(Object.assign({},v,{ref:ref,lang:L,file:b64,fileName:v.file}))
      }).then(finish,finish);
    }catch(e){ finish(); }
  });
};

document.querySelectorAll(".copybtn").forEach(function(b){
  b.onclick=function(){
    var val=b.getAttribute("data-copy"), em=b.querySelector("em"), was=em.textContent;
    function ok(){ em.textContent=T[L].copied; b.classList.add("copied");
      setTimeout(function(){ em.textContent=was; b.classList.remove("copied"); },1600); }
    if(navigator.clipboard&&window.isSecureContext){
      navigator.clipboard.writeText(val).then(ok,fb);
    } else fb();
    function fb(){
      var ta=document.createElement("textarea");
      ta.value=val; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); ok(); }catch(e){}
      document.body.removeChild(ta);
    }
  };
});

$("copyMsg").onclick=function(){
  var self=this;
  function done(){ self.textContent=T[L].copied;
    setTimeout(function(){ self.textContent=T[L].copyMsg; },1600); }
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(lastMsg).then(done,fallback);
  } else fallback();
  function fallback(){
    var ta=document.createElement("textarea");
    ta.value=lastMsg; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); done(); }catch(e){ alert(lastMsg); }
    document.body.removeChild(ta);
  }
};
$("again").onclick=function(){ clearDraft(); location.reload(); };

(function(){
  var box=$("petals"); if(!box) return;
  if(window.matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  for(var i=0;i<9;i++){
    var p=document.createElement("i");
    p.className = i%2 ? "petal" : "petal g";
    p.style.left=(Math.random()*100)+"%";
    p.style.animationDuration=(13+Math.random()*11)+"s";
    p.style.animationDelay=(-Math.random()*20)+"s";
    p.style.opacity=(0.25+Math.random()*0.35);
    p.style.transform="scale("+(0.7+Math.random()*0.8)+")";
    box.appendChild(p);
  }
})();

var saved=loadDraft();
apply(saved||"en");
